<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <!-- Fallback: font loads async, game works without it -->
  <!-- Game fills full viewport edge-to-edge; UI avoids safe areas via PixiJS positioning -->
  <title>Roxy's Magic Reels</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0c0a08;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      touch-action: none;
    }
    #loading {
      position: absolute;
      color: #d4a0ff;
      font-family: 'Segoe UI', sans-serif;
      font-size: 24px;
      text-align: center;
    }
    #loading .bar {
      width: 200px;
      height: 6px;
      background: #2a1a4e;
      border-radius: 3px;
      margin-top: 12px;
    }
    #loading .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #9b59b6, #f1c40f);
      border-radius: 3px;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div id="err-overlay" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:black;color:red;font-size:12px;padding:40px 16px;white-space:pre-wrap;overflow:auto;display:none"></div>
  <script>
    window.onerror = function(m,s,l,c,e) {
      var d = document.getElementById('err-overlay');
      d.style.display = 'block';
      d.textContent = 'ERROR: ' + m + '\n\nSource: ' + s + ':' + l + ':' + c + '\n\n' + (e && e.stack ? e.stack : '');
    };
    window.addEventListener('unhandledrejection', function(ev) {
      var d = document.getElementById('err-overlay');
      d.style.display = 'block';
      var r = ev.reason;
      d.textContent = 'UNHANDLED REJECTION:\n\n' + (r && r.stack ? r.stack : r);
    });
  </script>
  <div id="loading">
    <div>Loading Roxy's Magic Reels...</div>
    <div class="bar"><div class="fill" id="load-fill"></div></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
